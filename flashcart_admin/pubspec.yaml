name: flash_cart
description: "FlashCart grocery delivery platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.0.5
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.0.0
  http: ^1.5.0
  vibration: ^3.1.3
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.4.0
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  flutter_local_notifications: ^22.3.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/flashcart_logo.png"

flutter:
  uses-material-design: true
