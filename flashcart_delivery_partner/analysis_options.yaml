# Dart / Flutter analyzer configuration.
# This file is used to check Dart code for errors, warnings and lints.

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - test/**

linter:
  rules:
    # Code quality
    - avoid_empty_else
    - avoid_print
    - avoid_unnecessary_containers
    - avoid_unused_constructor_parameters
    - empty_catches
    - empty_statements

    # Style
    - always_declare_return_types
    - avoid_init_to_null
    - avoid_redundant_argument_values
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes
    - unnecessary_const
    - unnecessary_new
    - unnecessary_null_checks
    - unnecessary_this

    # Flutter
    - use_build_context_synchronously
    - use_key_in_widget_constructors